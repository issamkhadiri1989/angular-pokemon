<form (ngSubmit)="onSearchSubmit()" class="col-12">
  <div class="form-row align-items-center py-5">
    <div class="col-6">
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="term"
        class="rounded-pill"
        autocomplete="off"
      />
      <button type="submit" class="btn btn-primary rounded-pill btn-sm ml-3">
        <i class="fa-solid fa-magnifying-glass"></i> search
      </button>
    </div>
  </div>
</form>
